name: Build Rikaz APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Rikaz ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -name 'Rikaz_EXACT_HTML_PROJECT.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "Rikaz ZIP not found"
            exit 1
          fi

          echo "ZIP found: $ZIP"
          mkdir -p /tmp/rikaz
          unzip -q "$ZIP" -d /tmp/rikaz

          PROJECT_DIR=$(find /tmp/rikaz -name settings.gradle -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Rikaz
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug

      - name: Upload Rikaz APK
        uses: actions/upload-artifact@v4
        with:
          name: Rikaz-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
